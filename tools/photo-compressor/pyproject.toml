[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-compressor"
version = "0.1.0"
description = "Safely compress JPEG and PNG images in batches."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LittleWang6770" }]
dependencies = ["Pillow>=10.0,<13"]

[project.scripts]
photo-compressor = "photo_compressor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
