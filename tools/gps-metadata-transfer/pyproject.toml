[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-metadata-transfer"
version = "0.1.0"
description = "Safely transfer GPS metadata from original photos to exported JPEG files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LittleWang6770" }]
dependencies = []

[project.scripts]
gps-metadata-transfer = "gps_metadata_transfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
